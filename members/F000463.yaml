bioguide:  F000463
contact_form:
  method: post
  action: "https://www.fischer.senate.gov/connect/email-deb/"
  steps:
    - visit: "https://www.fischer.senate.gov/connect/email-deb/"
    - fill_in:
        - name: input_13
          selector: "#input_7_13"
          value: $NAME_PREFIX
          required: false
        - name: input_3
          selector: "#input_7_3"
          value: $NAME_FIRST
          required: true
        - name: input_4
          selector: "#input_7_4"
          value: $NAME_LAST
          required: true
        - name: input_5.1
          selector: "#input_7_5_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_5.2
          selector: "#input_7_5_2"
          value: $ADDRESS_STREET_2
          required: false
        - name: input_5.3
          selector: "#input_7_5_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_5.5
          selector: "#input_7_5_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_7
          selector: "#input_7_7"
          value: $PHONE
          required: true
        - name: input_8
          selector: "#input_7_8"
          value: $EMAIL
          required: true
        - name: input_10
          selector: "#input_7_10"
          value: $SUBJECT
          required: true
        - name: input_11
          selector: "#input_7_11"
          value: $MESSAGE
          required: true
    - select:
        - name: input_5.4
          selector: "#input_7_5_4"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
            - Alabama
            - Alaska
            - American Samoa
            - Arizona
            - Arkansas
            - California
            - Colorado
            - Connecticut
            - Delaware
            - District of Columbia
            - Florida
            - Georgia
            - Guam
            - Hawaii
            - Idaho
            - Illinois
            - Indiana
            - Iowa
            - Kansas
            - Kentucky
            - Louisiana
            - Maine
            - Maryland
            - Massachusetts
            - Michigan
            - Minnesota
            - Mississippi
            - Missouri
            - Montana
            - Nebraska
            - Nevada
            - New Hampshire
            - New Jersey
            - New Mexico
            - New York
            - North Carolina
            - North Dakota
            - Northern Mariana Islands
            - Ohio
            - Oklahoma
            - Oregon
            - Pennsylvania
            - Puerto Rico
            - Rhode Island
            - South Carolina
            - South Dakota
            - Tennessee
            - Texas
            - Utah
            - U.S. Virgin Islands
            - Vermont
            - Virginia
            - Washington
            - West Virginia
            - Wisconsin
            - Wyoming
            - Armed Forces Americas
            - Armed Forces Europe
            - Armed Forces Pacific
        - name: input_9
          selector: "#input_7_9"
          value: $TOPIC
          required: true
          options:
            - Agriculture
            - Banking
            - Budget
            - "Defense, Terrorism"
            - Economy
            - Education
            - Energy
            - Environment
            - Federal Government
            - Foreign Affairs
            - Health
            - Housing
            - Immigration
            - Intelligence/National Security
            - Judiciary
            - "Labor, Unemployment Issues"
            - Medicaid/Medicare
            - Science and Technology
            - Senior Issues
            - Second Amendment Rights
            - Small Business
            - Social Security
            - Taxes
            - Telecommunications
            - Trade
            - Transportation
            - "Veterans' Affairs"
            - Welfare
            - Other
    - javascript:
        - value: document.querySelector("#input_7_11").value = document.querySelector("#input_7_11").value.replace(/"/g, '');
    - click_on:
        - value: Submit
          selector: "#gform_submit_button_7"
  success:
    headers:
      status: 200
    body:
      contains: Thank you
