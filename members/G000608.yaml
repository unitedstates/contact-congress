bioguide:  G000608
contact_form:
  method: POST
  action: https://www.lgraham.senate.gov/public/index.cfm?p=contact-form
  steps:
    - visit: https://www.dgraham.senate.gov/
    - fill_in:
      - name: "form_fields[field_1d46919]"
        selector: "#form-field-field_1d46919"
        value: $NAME_FIRST
        required: true
      - name: "form_fields[field_bdcaff9]"
        selector: "#form-field-field_bdcaff9"
        value: $NAME_LAST
        required: true
      - name: "form_fields[field_00c2cf4]"
        selector: "#form-field-field_00c2cf4"
        value: $ADDRESS_STREET
        required: true
      - name: "form_fields[field_5ce9e4e]"
        selector: "#form-field-field_5ce9e4e"
        value: $ADDRESS_CITY
        required: true
      - name: "form_fields[field_1037219]"
        selector: "#form-field-field_1037219"
        value: $ADDRESS_ZIP5
        required: true
      - name: "form_fields[email]"
        selector: "#form-field-email"
        value: $EMAIL
        required: true
      - name: "form_fields[field_01539f0]"
        selector: "#form-field-field_01539f0"
        value: $MESSAGE
        required: true
      - name: "form_fields[field_9411e2b]"
        selector: "#form-field-field_9411e2b"
        value: $PHONE
        required: false
    - select:
      - name: "field_694A4E8E-E869-4156-8A02-1D58DE8111EE"
        selector: "#field_694A4E8E-E869-4156-8A02-1D58DE8111EE"
        value: $NAME_PREFIX
        required: true
        options:
          - "Mr."
          - "Mrs."
          - "Ms."
          - "Mr. and Mrs."
          - "Miss"
          - "Dr."
      - name: "field_4C82AB6E-E5FA-4362-A194-6DE9AADA20A7"
        selector: "#field_4C82AB6E-E5FA-4362-A194-6DE9AADA20A7"
        value: $TOPIC
        required: true
        options:
          "Abortion": "Abortion"
          "Agriculture": "AG"
          "Aviation": "AIR"
          "Border Security/Immigration": "IMM"
          "Campaign Finance": "CF"
          "Defense/Military": "DEF"
          "Economy": "ECONOMY"
          "Education": "ED"
          "Energy": "EN"
          "Environment": "ENV"
          "Ethics": "ETHICS"
          "Federal Budget": "BUD"
          "Federal Emergency Management Agency": "FEMA"
          "Financial Services": "FINANCE"
          "Gun Control": "GUN"
          "Health- General, Medicare, Medicaid": "HEA"
          "Homeland Security/Terrorism": "NATL SEC"
          "Housing": "HOUSING"
          "Internship": "INTERN"
          "International Relations": "IR"
          "Judicial Nominations/Supreme Court": "JUDICIARY"
          "Labor": "LAB"
          "Pensions": "PENSIONS"
          "Postal Issues": "POSTAL"
          "Social Security and Pensions": "SSA"
          "Taxes": "TAX"
          "Telecommunications": "TELECOM"
          "Trade": "TRADE"
          "Transportation Authorization": "TRAN"
          "Veterans Affairs": "VET"
          "Welfare": "WELF"
      - name: "field_2D95B7F7-4DFA-44A5-8487-E0148AB92ACA"
        selector: "#field_2D95B7F7-4DFA-44A5-8487-E0148AB92ACA"
        value: "Yes, I would like a written response"
        required: true
        options:
          "Yes, I would like a written response": "Yes"
          "No, I am just passing my comments along.": "No"
    - javascript:
      - value: document.querySelector("#field_F1684590-B63E-4986-8A57-1216FEFE8B9F").value = document.querySelector("#field_F1684590-B63E-4986-8A57-1216FEFE8B9F").value.replace(/"/g, '');
    - click_on:
      - value: Submit
        selector: ".btn"
  success:
    headers:
      status: 200
    body:
      contains: "Your message has been received."
