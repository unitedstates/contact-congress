bioguide: R000584
contact_form:
  method: post
  action: ""
  steps:
    - visit: "https://www.risch.senate.gov/contact/share-your-opinion/"
    - wait:
        - value: 5
    - javascript:
        - value: "document.body.style.visibility = 'inherit'; var w = document.querySelector('#gform_wrapper_2'); if (w) { w.style.display = 'block'; w.style.visibility = 'visible'; w.style.opacity = '1'; } var f = document.querySelector('#gform_wrapper_2 form'); if (f) { f.style.opacity = '1'; f.style.visibility = 'visible'; }"
    - find:
        - selector: "#input_2_2"
          options:
            wait: 20
    - fill_in:
        - name: input_2
          selector: "#input_2_2"
          value: $NAME_FIRST
          required: true
        - name: input_3
          selector: "#input_2_3"
          value: $NAME_LAST
          required: true
        - name: input_6.1
          selector: "#input_2_6_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_6.3
          selector: "#input_2_6_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_6.5
          selector: "#input_2_6_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_49
          selector: "#input_2_49"
          value: $PHONE
          required: true
        - name: input_9
          selector: "#input_2_9"
          value: $EMAIL
          required: true
        - name: input_12
          selector: "#input_2_12"
          value: $MESSAGE
          required: true
          options:
            max_length: 1500
    - select:
        - name: input_39
          selector: "#input_2_39"
          value: $NAME_PREFIX
          required: true
          options:
            - Mr.
            - Mrs.
            - M.
            - Ms.
            - Miss
            - Professor
            - Dean
            - The Honorable
            - Dr.
            - Military Rank
            - Reverend
            - Rabbi
            - Sister
            - Father
        - name: input_6.4
          selector: "#input_2_6_4"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
            - Alabama
            - Alaska
            - American Samoa
            - Arizona
            - Arkansas
            - California
            - Colorado
            - Connecticut
            - Delaware
            - District of Columbia
            - Florida
            - Georgia
            - Guam
            - Hawaii
            - Idaho
            - Illinois
            - Indiana
            - Iowa
            - Kansas
            - Kentucky
            - Louisiana
            - Maine
            - Maryland
            - Massachusetts
            - Michigan
            - Minnesota
            - Mississippi
            - Missouri
            - Montana
            - Nebraska
            - Nevada
            - New Hampshire
            - New Jersey
            - New Mexico
            - New York
            - North Carolina
            - North Dakota
            - Northern Mariana Islands
            - Ohio
            - Oklahoma
            - Oregon
            - Pennsylvania
            - Puerto Rico
            - Rhode Island
            - South Carolina
            - South Dakota
            - Tennessee
            - Texas
            - Utah
            - U.S. Virgin Islands
            - Vermont
            - Virginia
            - Washington
            - West Virginia
            - Wisconsin
            - Wyoming
            - Armed Forces Americas
            - Armed Forces Europe
            - Armed Forces Pacific
    - click_on:
        - name: "input_48"
          selector: "#choice_2_48_1"
    - click_on:
        - selector: "#gform_submit_button_2"
    - find:
        - selector: "#gform_confirmation_message_2"
  success:
    headers:
      status: 200
    body:
      contains: "Thank you for contacting my office"
