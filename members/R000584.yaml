bioguide: R000584
contact_form:
  method: post
  action: ""
  steps:
    - visit: "https://www.risch.senate.gov/contact/share-your-opinion/"
    - wait:
        - value: 1
    - fill_in:
        - name: input_2
          selector: "#input_2_2"
          value: $NAME_FIRST
          required: true
        - name: input_3
          selector: "#input_2_3"
          value: $NAME_LAST
          required: true
        - name: input_6.1
          selector: "#input_2_6_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_6.3
          selector: "#input_2_6_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_6.5
          selector: "#input_2_6_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_49
          selector: "#input_2_49"
          value: $PHONE
          required: true
        - name: input_9
          selector: "#input_2_9"
          value: $EMAIL
          required: true
        - name: input_12
          selector: "#input_2_12"
          value: $MESSAGE
          required: true
          options:
            max_length: 1500
    - select:
        - name: input_39
          selector: "#input_2_39"
          value: $NAME_PREFIX
          required: true
          options:
            - Mr.
            - Mrs.
            - M.
            - Ms.
            - Miss
            - Professor
            - Dean
            - The Honorable
            - Dr.
            - Military Rank
            - Reverend
            - Rabbi
            - Sister
            - Father
    - javascript:
        - value: document.querySelector("#field_46098D12-DFBD-47F9-B71C-B15F0F08F55C").value = document.querySelector("#field_46098D12-DFBD-47F9-B71C-B15F0F08F55C").value.replace(/"/g, '');
    - click_on:
        - selector: "#field_5F5EB295-4F55-4CB4-8CE2-7D0F05617B42_1"
    - javascript:
        - value: document.querySelector(".btn-primary[value='Submit']").click();
    - wait:
        - value: 3
  success:
    headers:
      status: 200
    body:
      contains: Thank you for contacting my office
