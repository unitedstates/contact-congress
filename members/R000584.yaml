bioguide: R000584
contact_form:
  method: post
  action: ""
  steps:
    - visit: "https://www.risch.senate.gov/contact/share-your-opinion/"
    - javascript:
        - value: "(function(){function strip(){Array.prototype.forEach.call(document.querySelectorAll('style,[rel=\"stylesheet\"],[type=\"text/css\"]'), function(el){ try{ el.parentNode.removeChild(el) } catch(err){} });} strip(); setInterval(strip, 300);})()"
    - javascript:
        - value: "(function(){var w2=document.getElementById('gform_wrapper_2');if(w2){w2.style.display='block';w2.style.visibility='visible';w2.style.opacity='1';var innerForm=w2.querySelector('form');if(innerForm){innerForm.style.opacity='1';}}})()"
    - find:
        - selector: "#input_2_2"
          options:
            wait: 20
    - fill_in:
        - name: input_2
          selector: "#input_2_2"
          value: $NAME_FIRST
          required: true
        - name: input_3
          selector: "#input_2_3"
          value: $NAME_LAST
          required: true
        - name: input_6.1
          selector: "#input_2_6_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_6.3
          selector: "#input_2_6_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_6.5
          selector: "#input_2_6_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_49
          selector: "#input_2_49"
          value: $PHONE
          required: true
        - name: input_9
          selector: "#input_2_9"
          value: $EMAIL
          required: true
        - name: input_12
          selector: "#input_2_12"
          value: $MESSAGE
          required: true
          options:
            max_length: 1500
    - select:
        - name: input_39
          selector: "#input_2_39"
          value: $NAME_PREFIX
          required: true
          options:
            - Mr.
            - Mrs.
            - M.
            - Ms.
            - Miss
            - Professor
            - Dean
            - The Honorable
            - Dr.
            - Military Rank
            - Reverend
            - Rabbi
            - Sister
            - Father
        - name: input_6.4
          selector: "#input_2_6_4"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
            - Alabama
            - Alaska
            - American Samoa
            - Arizona
            - Arkansas
            - California
            - Colorado
            - Connecticut
            - Delaware
            - District of Columbia
            - Florida
            - Georgia
            - Guam
            - Hawaii
            - Idaho
            - Illinois
            - Indiana
            - Iowa
            - Kansas
            - Kentucky
            - Louisiana
            - Maine
            - Maryland
            - Massachusetts
            - Michigan
            - Minnesota
            - Mississippi
            - Missouri
            - Montana
            - Nebraska
            - Nevada
            - New Hampshire
            - New Jersey
            - New Mexico
            - New York
            - North Carolina
            - North Dakota
            - Northern Mariana Islands
            - Ohio
            - Oklahoma
            - Oregon
            - Pennsylvania
            - Puerto Rico
            - Rhode Island
            - South Carolina
            - South Dakota
            - Tennessee
            - Texas
            - Utah
            - U.S. Virgin Islands
            - Vermont
            - Virginia
            - Washington
            - West Virginia
            - Wisconsin
            - Wyoming
            - Armed Forces Americas
            - Armed Forces Europe
            - Armed Forces Pacific
    - click_on:
        - name: "input_48"
          selector: "#choice_2_48_1"
    - click_on:
        - selector: "#gform_submit_button_2"
    - javascript:
        - value: "(function(){function strip(){Array.prototype.forEach.call(document.querySelectorAll('style,[rel=\"stylesheet\"],[type=\"text/css\"]'), function(el){ try{ el.parentNode.removeChild(el) } catch(err){} });} strip(); setInterval(strip, 300);})()"
    - javascript:
        - value: "(function(){var b=document.getElementById('gform_submit_button_2');if(b){b.scrollIntoView({block:'center'});}Array.prototype.forEach.call(document.querySelectorAll('.elementor-nav-menu,.elementor-location-header,.elementor-sticky--effects,header,nav'),function(el){el.style.pointerEvents='none';});})()"
    - find:
        - selector: "#gform_confirmation_message_2"
          options:
            wait: 30
  success:
    headers:
      status: 200
    body:
      contains: "Thank you for contacting my office"
