bioguide:  W000817
contact_form:
  method: post
  action: "https://www.warren.senate.gov/contact/share-your-opinion/"
  steps:
    - visit: "https://www.warren.senate.gov/contact/share-your-opinion/"
    - find:
        - selector: "#input_12_4"
    - fill_in:
        - name: input_4
          selector: "#input_12_4"
          value: $NAME_FIRST
          required: true
        - name: input_5
          selector: "#input_12_5"
          value: $NAME_LAST
          required: true
        - name: input_7
          selector: "#input_12_7"
          value: $PHONE
          required: true
        - name: input_8
          selector: "#input_12_8"
          value: $EMAIL
          required: true
        - name: input_9.1
          selector: "#input_12_9_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_9.2
          selector: "#input_12_9_2"
          value: $ADDRESS_STREET_2
          required: false
        - name: input_9.3
          selector: "#input_12_9_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_9.5
          selector: "#input_12_9_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_11
          selector: "#input_12_11"
          value: $SUBJECT
          required: true
        - name: input_12
          selector: "#input_12_12"
          value: $MESSAGE
          required: true
    - select:
        - name: input_3
          selector: "#input_12_3"
          value: $NAME_PREFIX
          required: true
          options:
            - Mr.
            - Mrs.
            - Prefer not to identify
            - Ms.
            - Miss
            - Professor
            - Dean
            - The Honorable
            - Dr.
        - name: input_9.4
