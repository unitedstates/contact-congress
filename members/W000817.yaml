        - name: input_13.1
          selector: "#choice_12_13_1"
    - javascript:
        - value: document.querySelector("#input_12_12").value = document.querySelector("#input_12_12").value.replace(/"/g, '');
    - click_on:
        - value: Submit
          selector: "#gform_submit_button_12"
