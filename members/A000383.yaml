bioguide:  A000383
contact_form: 
  method: post
  action: ""
  steps: 
  - visit: "https://www.armstrong.senate.gov/contact/"
  - fill_in:
        - name: input_2
          selector: "#input_1_1_3"
          value: $NAME_FIRST
          required: true
        - name: input_3
          selector: "#input_1_1_6"
          value: $NAME_LAST
          required: true
        - name: input_6.1
          selector: "#input_1_2_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_6.2
          selector: "#input_2_6_2"
          value: $ADDRESS_STREET_2
          required: false
        - name: input_6.3
          selector: "#input_1_2_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_6.5
          selector: "#input_1_2_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_41
          selector: "#input_1_4"
          value: $PHONE
          required: true
        - name: input_42
          selector: "#input_1_3"
          value: $EMAIL
          required: true
        - name: input_11
          selector: "#input_1_14"
          value: $SUBJECT
          required: true
        - name: input_12
          selector: "#input_1_8"
          value: $MESSAGE
          required: true
        - name: input_12
          selector: "#input_1_8"
          value: $MESSAGE
          required: true
        - name: input_2.4
          selector: "#input_1_2_4"
          value: $ADDRESS_STATE_POSTAL_ABBREV
          required: true            
  - select:
      - name: input_39
        selector: "#input_2_39"
        value: $NAME_PREFIX
        required: true
        options:
          - Mr.
          - Mrs.
          - Ms.
          - Miss
          - Professor
          - Dean
          - The Honorable
          - Dr.
      - name: input_17
        selector: "#input_2_17"
        value: $TOPIC
        required: true
        options:
          Agriculture: AGR
          Animals: AN
          Arts and Humanities: ART
          Banking: BANK
          Budget: BUD
          Commerce: COMM
          Defense and Military: DEF
          Drugs: DRUG
          Economy: ECON
          Education: EDU
          Election: ELEC
          Energy: ENE
          Environmental: ENV
          Family Values: FAM
          Finance: FINANCE
          Flag Requests: FLAG
          Foreign Relations: FR
          Governmental Reform: GOV
          Guns: GUN
          Health: HEA
          Help with a Federal Agency: CASEWORK
          Homeland Security: HOM
          Housing and Urban Development: HUD
          Immigration: IMM
          Infrastructure: INFRA
          Interior: INTERIOR
          Judiciary: JUD
          Labor: LAB
          Nutrition: NUTRI
          Post Office: POST
          Science and Technology: SCI
          Senior Citizens: SENIORS
          Small Business: SMB
          Social Issues: SOC
          Social Security: SSEC
          Taxes: TAX
          Telecommunications: TEL
          Trade: TRADE
          Transportation: TRA
          Veterans: VET
          Welfare: WEL
          Women's Issues: WOMEN
  - javascript:
      - value: document.querySelector("#input_2_12").value = document.querySelector("#input_2_12").value.replace(/"/g, '');
  - click_on:
      - selector: '#gform_submit_button_2'
  success:
    headers:
      status: 200
    body:
      contains: "Your submission was successful"
