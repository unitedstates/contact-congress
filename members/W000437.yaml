bioguide:  W000437
contact_form:
  method: post
  action: ""
  steps:
    - visit: "https://www.wicker.senate.gov/contact/email-me/"
    - fill_in:
        - name: input_1.3
          selector: "#input_3_1_3"
          value: $NAME_FIRST
          required: true
        - name: input_1.6
          selector: "#input_3_1_6"
          value: $NAME_LAST
          required: true
        - name: input_4.1
          selector: "#input_3_4_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_4.3
          selector: "#input_3_4_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_4.5
          selector: "#input_3_4_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_9
          selector: "#input_3_9"
          value: $PHONE
          required: true
        - name: input_2
          selector: "#input_3_2"
          value: $EMAIL
          required: true
        - name: input_3
          selector: "#input_3_3"
          value: $MESSAGE
          required: true
    - javascript:
        - value: document.querySelector("#field_9CBA10ED-C94F-4770-A165-38166625C0A8").options[8].selected = true
    - javascript:
        - value: document.querySelector("#field_5EF876CF-9476-427B-A01B-25AAFD0E013D").value = document.querySelector("#field_5EF876CF-9476-427B-A01B-25AAFD0E013D").value.replace(/"/g, '');
    - javascript:
        - value: "document.querySelector('#g-recaptcha-response').style.cssText = 'display: block; margin-top: 5em;';"
    - recaptcha:
        - value: true
    - click_on:
        - value: Submit
          selector: input.btn.btn-primary
    - find:
        - selector: "p"
          value: "Thank you for contacting me."
  success:
    headers:
      status: 200
    body:
      contains: Thank you for contacting me
