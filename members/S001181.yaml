bioguide:  S001181
contact_form:
  method: post
  action: "https://www.shaheen.senate.gov/contact/contact-jeanne"
  steps:
    - visit: "https://www.shaheen.senate.gov/contact/contact-jeanne"
    - wait:
        - value: 3
    # Senate forms.cfc builder often fails on first load and leaves a spinner.
    # Re-run the site's builder if the form didn't render.
    - javascript:
        - value: "if (!document.querySelector('#input-9247EFE3-AE07-B24E-99DB-FC001CEF0DBE') && window.creativengine_forms_builder) { creativengine_forms_builder.init(); }"
    - wait:
        - value: 3
    - javascript:
        - value: "if (!document.querySelector('#input-9247EFE3-AE07-B24E-99DB-FC001CEF0DBE') && window.creativengine_forms_builder) { creativengine_forms_builder.init(); }"
    - find:
        - selector: "#input-9247EFE3-AE07-B24E-99DB-FC001CEF0DBE"
          timeout: 10
    - fill_in:
        - name: input_9247EFE3-AE07-B24E-99DB-FC001CEF0DBE
          selector: "#input-9247EFE3-AE07-B24E-99DB-FC001CEF0DBE"
          value: $NAME_FIRST
          required: true
        - name: input_9247EF17-9167-46F0-812B-5EC75B70D025
          selector: "#input-9247EF17-9167-46F0-812B-5EC75B70D025"
          value: $NAME_LAST
