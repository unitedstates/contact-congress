bioguide:  H001061
contact_form:
  method: post
  action: "https://www.hoeven.senate.gov/contact/contact-the-senator/comment-on-an-issue-before-the-senate"
  steps:
    - visit: "https://www.hoeven.senate.gov/contact/contact-the-senator/comment-on-an-issue-before-the-senate"
    - find:
        - selector: "#gform_14"
    - fill_in:
        - name: input_3
          selector: "#input_14_3"
          value: $NAME_FIRST
          required: true
        - name: input_4
          selector: "#input_14_4"
          value: $NAME_LAST
          required: true
        - name: input_6.1
          selector: "#input_14_6_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_6.3
          selector: "#input_14_6_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_6.5
          selector: "#input_14_6_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_7
          selector: "#input_14_7"
          value: $PHONE
          required: true
        - name: input_9
          selector: "#input_14_9"
          value: $EMAIL
          required: true
        - name: input_9_2
          selector: "#input_14_9_2"
          value: $EMAIL
          required: true
        - name: input_11
          selector: "#input_14_11"
          value: $SUBJECT
          required: false
        - name: input_14
          selector: "#input_14_14"
          value: $MESSAGE
          required: true
    - select:
        - name: input_5
          selector: "#input_14_5"
          value: $NAME_PREFIX
          required: true
          options:
            Mr.: Mr.
            Mrs.: Mrs.
            Prefer not to identify: Prefer not to identify
            Ms.: Ms.
            Miss: Miss
            Professor: Professor
            Dean: Dean
            The Honorable: The Honorable
            Dr.: Dr.
        - name: input_6.4
          selector: "#input_14_6_4"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
            Alabama: AL
            Alaska: AK
            American Samoa: AS
            Arizona: AZ
            Arkansas: AR
            California: CA
            Colorado: CO
            Connecticut: CT
            Delaware: DE
            District of Columbia: DC
            Florida: FL
            Georgia: GA
            Guam: GU
            Hawaii: HI
            Idaho: ID
            Illinois: IL
            Indiana: IN
            Iowa: IA
            Kansas: KS
            Kentucky: KY
            Louisiana: LA
            Maine: ME
            Maryland: MD
            Massachusetts: MA
            Michigan: MI
            Minnesota: MN
            Mississippi: MS
            Missouri: MO
            Montana: MT
            Nebraska: NE
            Nevada: NV
            New Hampshire: NH
            New Jersey: NJ
            New Mexico: NM
            New York: NY
            North Carolina: NC
            North Dakota: ND
            Northern Mariana Islands: MP
            Ohio: OH
            Oklahoma: OK
            Oregon: OR
            Pennsylvania: PA
            Puerto Rico: PR
            Rhode Island: RI
            South Carolina: SC
            South Dakota: SD
            Tennessee: TN
            Texas: TX
            Utah: UT
            U.S. Virgin Islands: VI
            Vermont: VT
            Virginia: VA
            Washington: WA
            West Virginia: WV
            Wisconsin: WI
            Wyoming: WY
            Armed Forces Americas: AA
            Armed Forces Europe: AE
            Armed Forces Pacific: AP
        - name: input_12
          selector: "#input_14_12"
          value: $TOPIC
          required: true
          options:
              Agriculture: Agriculture
              Budget: Budget
              Civil Rights: Civil Rights
              Communications: Communications
              Defense: Defense
              Economic Development: Economic Development
              Economy and Jobs: Economy and Jobs
              Education: Education
              Energy: Energy
              Environment: Environment
              Flooding Issues: Flooding Issues
              Foreign Relations: Foreign Relations
              Guns: Guns
              Health: Health
              Health Insurance: Health Insurance
              Homeland Security: Homeland Security
              Housing: Housing
              Immigration: Immigration
              Indian Affairs: Indian Affairs
              Insurance: Insurance
              Judiciary: Judiciary
              Medicare: Medicare
              Social Security: Social Security
              Taxes: Taxes
              Trade: Trade
              Transportation: Transportation
              Veterans: Veterans
              Welfare: Welfare
    - click_on:
        - value: Submit
          selector: "#gform_submit_button_14"
    - find:
        - selector: ".gform_confirmation_message"
  success:
    headers:
      status: 200
    body:
      contains: Thank You
