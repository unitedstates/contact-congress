bioguide:  K000384
contact_form:
  method: POST
  action: ""
  steps:
    - visit: https://www.kaine.senate.gov/contact/share-your-opinion
    - find:
      - selector: "#input-C37493FA-32C9-4AC5-8741-DBB15B656231"
    - fill_in:
      - name: first
        selector: "#input-C37493FA-32C9-4AC5-8741-DBB15B656231"
        value: $NAME_FIRST
        required: Yes
      - name: last
        selector: "#input-FA29AA7F-6264-43AD-93A0-A9C8E4137B5C"
        value: $NAME_LAST
        required: Yes
      - name: addr1
        selector: "#input-0EAD335B-9386-4CE4-BEEC-4EB7A25154B0"
        value: $ADDRESS_STREET
        required: Yes
      - name: city
        selector: "#input-FDAA72A6-BACD-478E-B29C-71F3517BEC76"
        value: $ADDRESS_CITY
        required: Yes
      - name: zip
        selector: "#input-7C66D390-A85C-4BB2-B6D4-D4B2A84642BB"
        value: $ADDRESS_ZIP5
        required: Yes
      - name: phone
        selector: "#input-74E0EC54-C170-4BCB-96AC-0A9CDECF046D"
        value: $PHONE
        required: Yes
      - name: email
        selector: "#email"
        value: $EMAIL
        required: Yes
      - name: subject
        selector: "#input-6113487C-5FF6-4D9E-BE80-52D0AF0F5877"
        value: $SUBJECT
        required: Yes
      - name: message
        selector: "#input-B11EA673-0986-41A8-96BF-81980A38B3F6"
        value: $MESSAGE
        required: Yes
    - select:
      - name: input_EC789E2A-A8CF-4502-BEDD-21C7CB62AB70
        selector: "#prefixtoggle"
        value: $NAME_PREFIX
        required: Yes
        options:
          - "Mr."
          - "Ms."
          - "Mrs."
          - "Mx."
          - "Miss"
          - "Mr. and Mrs."
          - "Dr."
      - name: topic
        selector: "#input-7B718140-BE58-48FA-AB5C-74CC385B8D07"
        value: $TOPIC
        required: Yes
        options:
          --- Please Select an Option ---: ""
          AGR: Agriculture
          AN: Animal Welfare
          APPROP: Appropriations
          ART: Arts & Humanities
          BANK: Banking & Financial Reform
          BUD: Budget
          BUSN: Business
          CFR: Campaign Finance Reform
          CHILD: Children's Issues
          CIVIL: Civil Rights
          CONG: Congress & Executive Office Reform
          CRIME: Crime & Law Enforcement
          CYBER: Cybersecurity
          DC: D.C. Issues
          DIS: Disabilities
          DR: Disaster Relief
          DV: Domestic Violence/Sexual Assault
          ECON: Economy
          EDU: Education
          ELECT: Election Issues
          EM: Emergency Management
          ENE: Energy
          ENV: Environment & Wildlife Protection
          FED: Federal Employees
          FA: Foreign Aid
          FR: Foreign Relations
          GUN: Gun Violence
          HEA: Health
          HOM: Homeland Security
          HUD: Housing
          IMM: Immigration
          IP: Intellectual Property
          INTEL: Intelligence
          JUD: Judicial Issues & Nominations
          LAB: Labor
          LGBT: LGBT
          MEDI: Medicare
          MH: Mental Health
          DEF: Military/Armed Services/Defense
          NAI: Native American Issues
          NUTRI: Nutrition/SNAP
          PEN: Pensions
          POST: Postal Issues
          PLNR: Public Lands & Natural Resources
          ABORT: Reproductive Rights
          RULES: Rules & Ethics
          SCI: Science & Technology
          SECAMEND: Second Amendment Rights
          SM.BUS: Small Business
          SSEC: Social Security
          SPACE: Space
          TAXES: Taxes
          TELE: Telecommunications & Internet
          TRADE: Trade
          TRA: Transportation & Infrastructure
          VET: Veterans
          VOTE: Voting Rights
          WORK: Workforce & Labor
      - name: response
        selector: "#input-569786FF-5652-42DE-A5EE-A7FBD312BC39"
        value: "Y"
        required: Yes
      - name: newsletter
        selector: "#newslettertoggle"
        value: "EMAIL.OPTIN"
        required: Yes
    - wait:
      - value: 2
    - click_on:
      - value: Submit
        selector: ".controls button[type='submit']"
    - wait:
      - value: 2
  success:
    headers:
      status: 200
    body:
      contains: Thanks for taking the time to share your thoughts with me.
