      - value: "(function(){function unhide(){var w = document.getElementById('gform_wrapper_2'); if (w) { w.classList.remove('gform_hidden'); w.style.display = 'block'; w.style.visibility = 'visible'; w.style.opacity = '1'; } var f = document.querySelector('#gform_wrapper_2 form'); if (f) { f.style.opacity = '1'; f.style.visibility = 'visible'; }} unhide(); setInterval(unhide, 300);})()"
