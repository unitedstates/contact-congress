bioguide:  J000293
contact_form:
  method: post
  action: ""
  steps:
    - visit: "https://www.ronjohnson.senate.gov/public/index.cfm/email-the-senator"
    - find:
        - selector: '#input_3_3'
    - fill_in:
        - name: input_3
          selector: "#input_3_3"
          value: $NAME_FIRST
          required: true
        - name: input_4
          selector: "#input_3_4"
          value: $NAME_LAST
          required: true
        - name: input_5.1
          selector: "#input_3_5_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_5.3
          selector: "#input_3_5_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_5.5
          selector: "#input_3_5_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_3_7
          selector: "#input_3_7"
          value: $EMAIL
          required: true
        - name: input_6
          selector: "#input_3_6"
          value: $PHONE
          required: true          
        - name: input_10
          selector: "#input_3_10"
          value: $MESSAGE
          required: true
    - select:
        - name: input_8
          selector: "#input_3_8"
          value: $TOPIC
          required: true
          options:
            Agriculture: AGR
            Budget: BUD
            Defense: DEF
            "Economy & Jobs": ECO
            Education and Labor: EDU
            Energy: ENE
            Environmental: ENV
            Foreign Relations: INT
            Health: HEA
            Homeland Security: HOM
            Immigration: IMM
            Judiciary: JUD
            Social Issues: SOC
            Social Security: SSEC
            Taxes and Trade: TAX
            Telecommunications: TEL
            Transportation: TRA
            Veterans: VET
            Welfare: WEL
            Other: OTH
    - javascript:
        - value: document.querySelector("input.btn.btn-primary").click()
  success:
    headers:
      status: 200
    body:
      contains: Thank you
