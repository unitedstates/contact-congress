bioguide:  T000250
contact_form:
  method: post
  action: ""
  steps:
    - visit: "https://www.thune.senate.gov/contact/email-senator-thune/"
    - fill_in:
        - name: input_2
          selector: "#input_2_2"
          value: $NAME_FIRST
          required: true
        - name: input_3
          selector: "#input_2_3"
          value: $NAME_LAST
          required: true
        - name: input_6.1
