bioguide:  C001095
contact_form:
  method: post
  action: "https://www.cotton.senate.gov/contact/contact-tom/"
  steps:
    - visit: "https://www.cotton.senate.gov/contact/contact-tom/"
    - fill_in:
        - name: input_3
          selector: "#input_2_3"
          value: $NAME_FIRST
          required: true
        - name: input_4
          selector: "#input_2_4"
          value: $NAME_LAST
          required: true
        - name: input_5.1
          selector: "#input_2_5_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_5.3
          selector: "#input_2_5_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_5.5
          selector: "#input_2_5_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_6
          selector: "#input_2_6"
          value: $PHONE
          required: true
        - name: input_13
          selector: "#input_2_13"
          value: $EMAIL
          required: true
        - name: input_13_2
          selector: "#input_2_13_2"
          value: $EMAIL
          required: true
        - name: input_11
          selector: "#input_2_11"
          value: $SUBJECT
          required: true
        - name: input_12
          selector: "#input_2_12"
          value: $MESSAGE
          required: true
    - select:
        - name: input_2
          selector: "#input_2_2"
          value: $NAME_PREFIX
          required: true
          options:
            - Mr.
            - Mrs.
            - Ms.
            - Dr.
            - Rev.
            - Prof.
            - Hon.
        - name: input_5.4
          selector: "#input_2_5_4"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
            - Alabama
