bioguide: B001261
contact_form:
  method: post
  action: /contact/contact-form/
  steps:
    - visit: "https://www.barrasso.senate.gov/contact/contact-form/"
    - fill_in:
        - name: first-name
          selector: "input[name='first-name']"
          value: $NAME_FIRST
          required: true
        - name: last-name
          selector: "input[name='last-name']"
          value: $NAME_LAST
          required: true
        - name: Address1
          selector: "input[name='Address1']"
          value: $ADDRESS_STREET
          required: true
        - name: address2
          selector: "input[name='address2']"
          value: $ADDRESS_STREET_2
          required: false
        - name: city
          selector: "input[name='city']"
          value: $ADDRESS_CITY
          required: true
        - name: zip-code
          selector: "input[name='zip-code']"
          value: $ADDRESS_ZIP5
          required: true
        - name: cell-phone
          selector: "input[name='cell-phone']"
          value: $PHONE
          required: false
        - name: your-email
          selector: "input[name='your-email']"
          value: $EMAIL
          required: true
        - name: your-message
          selector: "textarea[name='your-message']"
          value: $MESSAGE
          required: true
    - select:
        - name: Prefix
          selector: "select[name='Prefix']"
          value: $NAME_PREFIX
          required: true
          options:
            - Mr.
            - Mrs.
            - Ms.
            - Mr. and Mrs.
            - Dr.
            - Dr. and Mrs.
            - Dr. and Mr.
            - Reverend
            - Sister
            - Pastor
            - The Honorable
            - Representative
            - Senator
        - name: State
          selector: "select[name='State']"
          value: $ADDRESS_STATE_FULL
          required: true
          options:
            - AA
            - AE
            - AP
            - Alabama
            - Alaska
            - Arizona
            - Arkansas
            - California
            - Colorado
            - Connecticut
            - Delaware
            - District of Columbia
            - Florida
            - Georgia
            - Hawaii
            - Idaho
            - Illinois
            - Indiana
            - Iowa
            - Kansas
            - Kentucky
            - Louisiana
            - Maine
            - Maryland
            - Massachusetts
            - Michigan
            - Minnesota
            - Mississippi
            - Missouri
            - Montana
            - Nebraska
            - Nevada
            - New Hampshire
            - New Jersey
            - New Mexico
            - New York
            - North Carolina
            - North Dakota
            - Ohio
            - Oklahoma
            - Oregon
            - Pennsylvania
            - Rhode Island
            - South Carolina
            - South Dakota
            - Tennessee
            - Texas
            - Utah
            - Vermont
            - Virginia
            - Washington
            - West Virginia
            - Wisconsin
            - Wyoming
        - name: topic
          selector: "select[name='topic']"
          value: $TOPIC
          required: true
          options:
            - Assistance with a Federal Agency
            - Congratulations Letter Request
            - Flag Request
            - Internship
            - Tour Request
            - Agriculture
            - Animals
            - Banking and Finance
            - Budget
            - Business
            - Campaign Reform
            - Congress
            - Constitution
            - Defense
            - Economy
            - Education
            - Employment
            - Energy
            - Environment
            - Federal Debt
            - Foreign Relations
            - Government
            - Healthcare
            - Human Rights
            - Immigration
            - Indian Affairs
            - Internet/Telecommunications
            - Labor
            - Medicare
            - President
            - Public Lands
            - Second Amendment and Gun Rights
            - Social Security
            - Taxes
            - Trade
            - Veterans
            - Other
    - choose:
        - name: want-response
          selector: "input[name='want-response']"
          value: "Yes"
          required: true
    - javascript:
        - value: document.querySelector("textarea[name='your-message']").value = document.querySelector("textarea[name='your-message']").value.replace(/"/g, '');
    - click_on:
        - value: Submit
          selector: "input.wpcf7-submit"
    - find:
        - selector: "form.wpcf7-form[data-status='sent']"
          options:
            wait: 30
  success:
    headers:
      status: 200
    body:
      contains: Thank you for your message
